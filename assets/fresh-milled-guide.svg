<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Fresh-milled flour guide"><rect width="1200" height="1600" fill="#f7f0e5"/><rect x="54" y="54" width="1092" height="1492" rx="36" fill="#fffdf8" stroke="#173f2b" stroke-width="6"/><circle cx="600" cy="205" r="92" fill="#173f2b"/><path d="M600 258V145M600 175c-26-10-44-27-56-48M600 205c28-10 47-28 59-51M600 235c-27-10-45-27-57-49" fill="none" stroke="#f4d6a9" stroke-width="12" stroke-linecap="round"/><text x="600" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="68" font-weight="700" fill="#173f2b">Why Fresh-Milled Flour?</text><text x="600" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" letter-spacing="2" fill="#7d6547">WHOLE GRAIN · MILLED CLOSE TO BAKING</text><g font-family="Arial,sans-serif"><g transform="translate(125 520)"><circle cx="70" cy="70" r="70" fill="#e9dcc4"/><text x="70" y="83" text-anchor="middle" font-size="46">🌾</text><text x="175" y="38" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#173f2b">Whole-grain goodness</text><text x="175" y="85" font-size="25" fill="#53645a">Bran, germ, and endosperm stay together,</text><text x="175" y="120" font-size="25" fill="#53645a">bringing the character of the whole grain.</text></g><g transform="translate(125 750)"><circle cx="70" cy="70" r="70" fill="#dce7d8"/><text x="70" y="83" text-anchor="middle" font-size="46">♡</text><text x="175" y="38" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#173f2b">Fuller flavor and aroma</text><text x="175" y="85" font-size="25" fill="#53645a">Fresh flour has warmth and depth that long-</text><text x="175" y="120" font-size="25" fill="#53645a">stored flour simply cannot imitate.</text></g><g transform="translate(125 980)"><circle cx="70" cy="70" r="70" fill="#f1dfc5"/><text x="70" y="83" text-anchor="middle" font-size="46">✦</text><text x="175" y="38" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#173f2b">More satisfying texture</text><text x="175" y="85" font-size="25" fill="#53645a">Whole-grain fiber creates baked goods with</text><text x="175" y="120" font-size="25" fill="#53645a">body, substance, and a naturally hearty bite.</text></g><g transform="translate(125 1210)"><circle cx="70" cy="70" r="70" fill="#dce7d8"/><text x="70" y="83" text-anchor="middle" font-size="46">⏱</text><text x="175" y="38" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#173f2b">Made close to the moment</text><text x="175" y="85" font-size="25" fill="#53645a">We mill with baking in mind, then turn that</text><text x="175" y="120" font-size="25" fill="#53645a">flour into something worth sharing.</text></g></g><rect x="170" y="1450" width="860" height="4" fill="#c89451"/><text x="600" y="1505" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-style="italic" fill="#173f2b">Made with love. Made for you.</text></svg>